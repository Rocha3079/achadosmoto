name: Atualizar Ofertas Diariamente

on:
  schedule:
    # Roda todos os dias às 08:00 AM (horário UTC = 05:00 AM Brasília)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar script de coleta
        run: python gerar_ofertas_motos.py

      - name: Salvar alterações no JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas_motos.json
          git commit -m "Atualização diária de ofertas" || exit 0
          git push